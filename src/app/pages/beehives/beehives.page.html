<ion-header>
  <ion-toolbar color="primary">

    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>

    <ion-title>
      {{ locationName }}
    </ion-title>

  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  @if(beehives.length === 0){

  <ion-card>
    <ion-card-content class="ion-text-center">
      Žádné úly
    </ion-card-content>
  </ion-card>

  }

  @for(hive of beehives; track hive.id){

  <ion-card button (click)="openRecords(hive)">

    <ion-card-header>

      <ion-card-title>
        Úl {{ hive.cislo }}
  </ion-card-title>

  <ion-card-subtitle>
  {{ hive.nazev }}
  </ion-card-subtitle>

</ion-card-header>

<ion-card-content>

  @if(hive.poznamky){
  <ion-note>
    {{ hive.poznamky }}
  </ion-note>
  }

  <ion-button
    fill="clear"
    color="danger"
    size="small"
    (click)="delete(hive.id); $event.stopPropagation()">
    Smazat
  </ion-button>

</ion-card-content>

</ion-card>

  }

</ion-content>

<ion-fab vertical="bottom" horizontal="end" slot="fixed">

  <ion-fab-button (click)="openModal()">
    <ion-icon name="add"></ion-icon>
  </ion-fab-button>

</ion-fab>

<ion-modal [isOpen]="isModalOpen">

  <ng-template>

    <ion-header>
      <ion-toolbar>

        <ion-title>Nový úl</ion-title>

        <ion-buttons slot="end">
          <ion-button (click)="closeModal()">
            Zavřít
          </ion-button>
        </ion-buttons>

      </ion-toolbar>
    </ion-header>

    <ion-content class="ion-padding">

      <ion-item>
        <ion-input
          label="Číslo úlu"
          labelPlacement="stacked"
          type="number"
          [(ngModel)]="newBeehive.cislo">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Název"
          labelPlacement="stacked"
          [(ngModel)]="newBeehive.nazev">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-textarea
          label="Poznámky"
          labelPlacement="stacked"
          [(ngModel)]="newBeehive.poznamky">
        </ion-textarea>
      </ion-item>

      <ion-button expand="block" (click)="save()">
        Uložit
      </ion-button>

    </ion-content>

  </ng-template>

</ion-modal>
